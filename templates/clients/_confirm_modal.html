{# Confirmación antes de eliminar. #}
<dialog class="modal modal--sm" id="confirm-modal" aria-labelledby="confirm-title" aria-describedby="confirm-text">
  <div class="modal__body confirm">
    <div class="confirm__icon" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
    </div>
    <h2 id="confirm-title">¿Eliminar cliente?</h2>
    <p id="confirm-text">Esta acción no se puede deshacer.</p>
  </div>
  <footer class="modal__foot modal__foot--center">
    <button type="button" class="btn btn--ghost" data-close-modal>Cancelar</button>
    <button type="button" class="btn btn--danger" id="confirm-delete">
      <span class="spinner" aria-hidden="true"></span>
      <span class="btn__label">Sí, eliminar</span>
    </button>
  </footer>
</dialog>
